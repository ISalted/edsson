name: edsson-aqa

on:
  # Manual only — trigger via the "Run workflow" button (or later from Testomatio).
  workflow_dispatch:
    inputs:
      title:
        description: "Testomatio run label"
        required: false
        default: ""
      grep:
        description: "Tag filter (e.g. @smoke)"
        required: false
        default: ""
      workers:
        description: "Workers per shard"
        required: false
        type: choice
        default: "1"
        options: ["1", "2", "3", "4", "5"]
      retries:
        description: "Retries per test"
        required: false
        type: choice
        default: "1"
        options: ["0", "1", "2"]

concurrency:
  group: aqa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run all tests
    runs-on: [self-hosted]
    # dev branch -> "dev" environment secrets, prod branch -> "prod" secrets
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      # picked up by lib/config -> process.env.* (no .env file in CI)
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_PRIVATE_ARTIFACTS: "1"
      TESTOMATIO_TITLE: "Edsson AQA [${{ github.ref_name }}] #${{ github.run_number }}${{ github.event.inputs.title && format(' — {0}', github.event.inputs.title) || '' }}"
      # browsers are pre-baked into the runner image
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check env (lengths only)
        run: |
          for v in BASE_URL API_URL ADMIN_EMAIL ADMIN_PASSWORD; do
            val="${!v}"
            ws="no"; [[ "$val" =~ [[:space:]] ]] && ws="YES"
            echo "$v: length=${#val} whitespace=$ws"
          done

      - name: Run all tests
        # Don't fail the whole run on individual test failures — real pass/fail
        # lives in Testomatio. Keeps the GitHub run green when a few of many flake.
        continue-on-error: true
        run: |
          npx playwright test tests/web \
            --project="Parallel Web" \
            --grep "${{ github.event.inputs.grep }}" \
            --workers=${{ github.event.inputs.workers }} \
            --retries=${{ github.event.inputs.retries }}

      - name: Upload HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: results.json
          retention-days: 14
