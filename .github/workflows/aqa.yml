name: edsson-aqa

on:
  # Manual only — trigger via the "Run workflow" button (or later from Testomatio).
  workflow_dispatch:
    inputs:
      grep:
        description: "Filter by tag (e.g. @smoke). Empty = run all."
        required: false
        default: ""

concurrency:
  group: aqa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    # target runner-1 only (its unique label) so the box isn't overloaded;
    # runner-2 stays available for the parallel-sharding demo via the "edsson" label.
    runs-on: [self-hosted, edsson-1]
    # dev branch -> "dev" environment secrets, prod branch -> "prod" secrets
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      # picked up by lib/config -> process.env.* (no .env file in CI)
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_PRIVATE_ARTIFACTS: "1"
      TESTOMATIO_TITLE: "Edsson AQA [${{ github.ref_name }}] #${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      - name: Debug — secrets presence & reachability (temporary)
        run: |
          echo "BASE_URL  set=$([ -n "$BASE_URL" ] && echo yes || echo no) len=${#BASE_URL}"
          echo "API_URL   set=$([ -n "$API_URL" ] && echo yes || echo no) len=${#API_URL}"
          echo "ADMIN_EMAIL    set=$([ -n "$ADMIN_EMAIL" ] && echo yes || echo no)"
          echo "ADMIN_PASSWORD set=$([ -n "$ADMIN_PASSWORD" ] && echo yes || echo no)"
          echo "TESTOMATIO     set=$([ -n "$TESTOMATIO" ] && echo yes || echo no)"
          echo "--- reachability using the actual BASE_URL secret ---"
          curl -sS -I --max-time 20 "$BASE_URL/login/" | head -1 || echo "curl FAILED"

      - name: Run tests
        run: |
          npx playwright test \
            --project="Parallel Web" \
            --grep "${{ github.event.inputs.grep }}" \
            --workers=1 \
            --retries=2

      - name: Upload HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
