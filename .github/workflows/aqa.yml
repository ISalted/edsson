name: edsson-aqa

on:
  # Manual only — trigger via the "Run workflow" button (or later from Testomatio).
  workflow_dispatch:
    inputs:
      title:
        description: "Testomatio run label"
        required: false
        default: ""
      grep:
        description: "Tag filter (e.g. @smoke)"
        required: false
        default: ""
      workers:
        description: "Workers per shard"
        required: false
        type: choice
        default: "1"
        options: ["1", "2", "3", "4", "5"]
      retries:
        description: "Retries per test"
        required: false
        type: choice
        default: "1"
        options: ["0", "1", "2"]

concurrency:
  group: aqa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run all tests
    runs-on: [self-hosted]
    # dev branch -> "dev" environment secrets, prod branch -> "prod" secrets
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      # picked up by lib/config -> process.env.* (no .env file in CI)
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_PRIVATE_ARTIFACTS: "1"
      TESTOMATIO_TITLE: "Edsson AQA [${{ github.ref_name }}] #${{ github.run_number }}${{ github.event.inputs.title && format(' — {0}', github.event.inputs.title) || '' }}"
    steps:
      - uses: actions/checkout@v4

      # Tests run in the official Playwright image (bundled Chromium): the native
      # Chrome on this Mac runner hangs on the login page's reCAPTCHA.
      - name: Run all tests
        # Don't fail the whole run on individual test failures — real pass/fail
        # lives in Testomatio. Keeps the GitHub run green when a few of many flake.
        continue-on-error: true
        env:
          GREP: ${{ github.event.inputs.grep }}
          WORKERS: ${{ github.event.inputs.workers }}
          RETRIES: ${{ github.event.inputs.retries }}
        run: |
          docker run --rm --ipc=host \
            -e BASE_URL -e API_URL -e ADMIN_EMAIL -e ADMIN_PASSWORD \
            -e TESTOMATIO -e TESTOMATIO_PRIVATE_ARTIFACTS -e TESTOMATIO_TITLE \
            -e GREP -e WORKERS -e RETRIES \
            -e CI=true -e PW_BUNDLED_CHROMIUM=1 \
            -v "$PWD":/work -w /work \
            -v edsson_node_modules:/work/node_modules \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            bash -c 'npm ci && npx playwright test tests/web --project="Parallel Web" --grep "$GREP" --workers="$WORKERS" --retries="$RETRIES"'

      - name: Upload login debug
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: login-debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: results.json
          retention-days: 14
