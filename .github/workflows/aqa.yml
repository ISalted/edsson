name: edsson-aqa

on:
  # Manual only — trigger via the "Run workflow" button (or later from Testomatio).
  workflow_dispatch:
    inputs:
      title:
        description: "Optional Testomatio run label (e.g. 'client demo'). Empty = default."
        required: false
        default: ""
      grep:
        description: "Filter by tag (e.g. @smoke). Empty = run all."
        required: false
        default: ""
      workers:
        description: "Parallel workers per shard (this box is 2 vCPU — keep at 1)."
        required: false
        type: choice
        default: "1"
        options: ["1", "2"]
      retries:
        description: "Retries per test (0 = expose raw flakiness)."
        required: false
        type: choice
        default: "1"
        options: ["0", "1", "2"]

concurrency:
  group: aqa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    # Alternative (Playwright's built-in count-based sharding) — можемо і так:
    #   - shard: "1"
    #     args: '--shard=1/2'
    #     runner: edsson-1
    #   - shard: "2"
    #     args: '--shard=2/2'
    #     runner: edsson-2
    name: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth
            args: tests/web/auth
            runner: edsson-1
          - shard: all (-auth)
            args: 'tests/web --grep-invert "@auth"'
            runner: edsson-2
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    # dev branch -> "dev" environment secrets, prod branch -> "prod" secrets
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      # picked up by lib/config -> process.env.* (no .env file in CI)
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_PRIVATE_ARTIFACTS: "1"
      # One Testomatio run per shard (mirrors the per-area split). The optional
      # `title` input is appended as a suffix when provided, else nothing.
      TESTOMATIO_TITLE: "Edsson AQA [${{ github.ref_name }}] ${{ matrix.shard }} #${{ github.run_number }}${{ github.event.inputs.title && format(' — {0}', github.event.inputs.title) || '' }}"
      # browsers are pre-baked into the runner image (edsson-runner-pw)
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No "Install Chrome" step — browsers are pre-baked into the runner image.

      - name: Run ${{ matrix.shard }} shard
        # Don't fail the whole run on individual test failures — real pass/fail
        # lives in Testomatio. Keeps the GitHub run green when a few of many flake.
        continue-on-error: true
        run: |
          npx playwright test ${{ matrix.args }} \
            --project="Parallel Web" \
            --grep "${{ github.event.inputs.grep }}" \
            --workers=${{ github.event.inputs.workers }} \
            --retries=${{ github.event.inputs.retries }}

      - name: Upload HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report-${{ matrix.shard }}
          path: results.json
          retention-days: 14
