name: edsson-aqa-pw

# Parallel/experimental workflow to validate the pre-baked Playwright runner
# image (label "edsson-pw"). No "Install Chrome" step — browsers are baked in.
# Once proven green, fold this into aqa.yml and retire the myoung34 runner.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Filter by tag (e.g. @smoke). Empty = run all."
        required: false
        default: ""

concurrency:
  group: aqa-pw-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (pre-baked image)
    runs-on: [self-hosted, edsson-pw]
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_PRIVATE_ARTIFACTS: "1"
      TESTOMATIO_TITLE: "Edsson AQA [pw][${{ github.ref_name }}] #${{ github.run_number }}"
      # browsers baked into the image at this path
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: no "Install Chrome" step — Chrome + deps are pre-baked in the image.

      - name: Run tests
        run: |
          npx playwright test \
            --project="Parallel Web" \
            --grep "${{ github.event.inputs.grep }}" \
            --workers=1 \
            --retries=2

      - name: Upload HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-pw
          path: playwright-report/
          retention-days: 14
